name: Checks
on: [push, pull_request]
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tracker:test-only@localhost:5432/tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://tracker:test-only@localhost:5432/tracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - run: ruff check ../benchmarks && ruff format --check ../benchmarks
      - run: PYTHONPATH=.:.. python -m pytest ../benchmarks/test_harness.py -q
      - run: alembic downgrade base && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: tracker_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python scripts/smoke.py
      - run: docker build -f frontend/Dockerfile.production -t tracker-web-release frontend
      - run: docker run --rm --add-host backend:127.0.0.1 tracker-web-release nginx -t
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down
