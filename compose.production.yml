# Standalone configuration: place an HTTPS ingress in front of localhost:8080.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
    volumes: ["production_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${PRODUCTION_ORIGINS:?Set JSON HTTPS origin array}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    depends_on: [backend]
volumes:
  production_data:
