# Separate project/volume; no database host port or real account data.
name: tracker-benchmark
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark-local-only
      POSTGRES_DB: tracker_benchmark
    volumes: ["benchmark_data:/var/lib/postgresql/data"]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d tracker_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://benchmark:benchmark-local-only@db:5432/tracker_benchmark
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://benchmark:benchmark-local-only@db:5432/tracker_benchmark
      ENVIRONMENT: test
      ALLOWED_ORIGINS: '["http://127.0.0.1:18001"]'
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    ports: ["127.0.0.1:18001:8000"]
    cpus: 2
    mem_limit: 1g
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  benchmark_data:
